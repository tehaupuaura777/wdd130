<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Activity week5</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <main>


        <form>
            <h1>Form Activity</h1>
            <div class="form-item column2">
                <label for="fullname">Full name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-item column2">
                <label for="useremail">Email:</label>
                <input type="email" name="useremail" id="useremail" required>
            </div>

            <div class="form-item column1">
                <label for="browser">What is your favorite browser:</label>
                <select name="browser" id="browser">
                    <option value="1">Google Chrome</option>
                    <option value="2">Brave</option>
                    <option value="3">Safari</option>
                    <option value="4">Edge</option>
                    <option value="5">Other</option>
                </select>
            </div>

            <div class="form-item column1"><label for="pet">Do you have a Pet ? <input
                      type="checkbox" id="pet" name="pet"></label></div>

            <div class="form-item">
                <label for="feedback">List the places you have lived</label>
                <textarea name="feedback" id="feedback" rows="4"
                  placeholder="tonga tahiti hawaii"></textarea>
            </div>

            <button type="submit">Submit Poll</button>
        </form>

    </main>

</body>

</html>
